name: BigProject2 CD

on:
  workflow_run:
    workflows:
      - BigProject2 CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send deployment command to EC2
        id: deploy
        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID is missing"
            exit 1
          fi

          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "cd /home/ubuntu/king-studio-data-platform",
              "if [ -n \"$(git status --porcelain)\" ]; then echo 'ERROR: EC2 working tree is not clean'; exit 1; fi",
              "git fetch origin main",
              "git merge --ff-only origin/main",
              "docker compose config --quiet",
              "docker compose up -d",
              "docker compose ps"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --parameters file:///tmp/ssm-params.json \
            --comment "BigProject2 automatic deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" || "$STATUS" == "DeliveryTimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text || true
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out waiting for SSM"
          exit 1
